name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar testes e empacotamento
        run: python3 scripts/testar.py
